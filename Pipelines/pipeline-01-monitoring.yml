trigger:
  paths:
    include:
      - terraform/monitoring/*
      - pipelines/pipeline-01-monitoring.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'sc-azure-connection' # Replace with your ADO Service Connection name
  resourceGroup: 'rg-tfstate-storage'            # Storage RG for Terraform state
  storageAccount: 'sttfstateprod001'             # Storage Account for state files
  containerName: 'tfstate'                        # Blob container
  tfStateKey: 'monitoring.tfstate'

steps:
- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: 'latest'

- task: TerraformTaskV4@4
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/monitoring'
    backendServiceArm: '$(azureServiceConnection)'
    backendAzureRmResourceGroupName: '$(resourceGroup)'
    backendAzureRmStorageAccountName: '$(storageAccount)'
    backendAzureRmContainerName: '$(containerName)'
    backendAzureRmKey: '$(tfStateKey)'

- task: TerraformTaskV4@4
  displayName: 'Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/monitoring'
    environmentServiceNameAzureRM: '$(azureServiceConnection)'

- task: TerraformTaskV4@4
  displayName: 'Terraform Apply'
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/monitoring'
    environmentServiceNameAzureRM: '$(azureServiceConnection)'